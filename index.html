<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sara</title>
<link rel="icon" href="icon192.png"><link rel="apple-touch-icon" href="icon192.png">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#05070f">
<style>
html,body{margin:0;height:100%;background:#05070f;color:#e6ecff;font-family:system-ui,sans-serif}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#msg img{width:84px;height:84px;border-radius:50%;box-shadow:0 0 26px rgba(91,140,255,.7)}
h1{font-weight:300;letter-spacing:10px;margin:16px 0 4px;padding-left:10px}
p{opacity:.7;max-width:300px;line-height:1.5}
</style></head><body>
<div id="msg"><img src="icon192.png" alt=""><h1>SARA</h1><p id="t">Connecting...</p></div>
<script>
function ok(u){return /^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(u)}
function off(){document.getElementById("t").textContent="Sara is resting right now. This page will reconnect by itself, please keep it open or come back soon."}
function go(){
 fetch("link.txt?"+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(u){
  u=u.trim();if(!ok(u)){off();return}
  fetch(u,{mode:"no-cors",cache:"no-store"}).then(function(){location.replace(u)}).catch(off)
 }).catch(off)
}
go();setInterval(go,15000);
</script></body></html>
